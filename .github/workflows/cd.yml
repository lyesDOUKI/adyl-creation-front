name: CD - Publish Frontend Docker Image

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: lyesdouki/adyl-creation-front

jobs:
  build-and-push-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion au GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraction des métadonnées (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build et Push de l'image Docker (avec cache)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trigger-vps-deploy:
    needs: build-and-push-docker
    runs-on: ubuntu-latest
    steps:
      - name: Trigger VPS deployment
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.INFRA_REPO_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/lyesdouki/adyl-creation-deployment/dispatches \
            -d "{\"event_type\":\"deploy-app\",\"client_payload\":{\"service\":\"frontend\",\"image_tag\":\"${{ needs.build-and-push-docker.outputs.image_version }}\"}}"